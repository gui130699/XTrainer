version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      # Atualizações de patch/minor de baixo risco entram numa PR só; majors ficam separadas
      # para revisão individual (nunca auto-merge de major version).
      routine-updates:
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
